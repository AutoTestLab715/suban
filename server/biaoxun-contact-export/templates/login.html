<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 甲方联系方式导出</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#10223f;background:radial-gradient(circle at 20% 10%,#dcecff 0,transparent 35%),linear-gradient(135deg,#f6f9fd,#eaf1fa)}.box{width:min(430px,100%);background:#fff;border:1px solid #e0e7f0;border-radius:22px;padding:34px;box-shadow:0 24px 70px #20466f24}.mark{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#1769e0,#62abff);display:grid;place-items:center;color:#fff;font-weight:800;margin-bottom:22px}h1{font-size:25px;margin:0 0 8px}.sub{font-size:14px;color:#69798d;line-height:1.7;margin:0 0 25px}label{display:block;font-size:13px;font-weight:700;color:#55667c;margin:15px 0 7px}input{width:100%;height:46px;border:1px solid #ccd7e5;border-radius:11px;padding:0 13px;font-size:15px;outline:none}input:focus{border-color:#1769e0;box-shadow:0 0 0 3px #1769e018}button{width:100%;height:47px;margin-top:22px;border:0;border-radius:11px;background:linear-gradient(135deg,#1769e0,#0b50b7);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.error{margin:15px 0 0;padding:11px 13px;background:#fff1f1;color:#9d2e2e;border-radius:9px;font-size:13px}.foot{font-size:12px;color:#8995a6;margin-top:18px;line-height:1.6}
</style></head><body><main class="box"><div class="mark">甲方</div><h1>标讯联系方式导出</h1><p class="sub">此工具包含采购单位联系方式，仅限授权人员使用。登录后可按关键词提取并导出。</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="{{ prefix }}/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" autofocus required><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">安全登录</button></form><div class="foot">连续登录失败会临时限制访问。请勿将导出的联系方式公开传播或用于无关用途。</div></main></body></html>

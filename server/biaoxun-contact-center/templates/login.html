<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
  <title>登录 · 甲方情报台</title>
  <style>
    :root{--bg:#06101b;--panel:#0d1d2c;--line:#244158;--text:#e7f0f6;--muted:#8ca2b4;--cyan:#22d3b6;--red:#ff9696}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 18% 5%,rgba(34,211,182,.18),transparent 34%),radial-gradient(circle at 90% 94%,rgba(60,130,220,.13),transparent 32%),var(--bg)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:38px 38px}.wrap{position:relative;width:min(940px,100%);display:grid;grid-template-columns:1.15fr .85fr;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:rgba(8,23,36,.94);box-shadow:0 30px 100px rgba(0,0,0,.42)}.intro{position:relative;padding:55px 48px;background:linear-gradient(145deg,rgba(18,46,62,.92),rgba(7,24,37,.95));overflow:hidden}.intro:after{content:"";position:absolute;width:350px;height:350px;left:-140px;bottom:-220px;border-radius:50%;border:1px solid rgba(34,211,182,.22);box-shadow:0 0 80px rgba(34,211,182,.1)}.mark{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;border:1px solid rgba(34,211,182,.5);background:rgba(34,211,182,.1);color:#62efd8;font-size:22px;font-weight:900}.eyebrow{margin-top:38px;font-size:11px;letter-spacing:.2em;color:var(--cyan);font-weight:800}.intro h1{margin:10px 0 15px;font-size:35px;line-height:1.2}.intro p{max-width:480px;color:var(--muted);font-size:14px;line-height:1.85}.points{display:grid;gap:13px;margin-top:30px}.point{display:flex;align-items:center;gap:10px;color:#bfd0dc;font-size:13px}.point i{font-style:normal;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:rgba(34,211,182,.1);color:var(--cyan);font-size:11px}.form-panel{padding:55px 42px;background:rgba(8,20,32,.93)}.form-panel h2{margin:0 0 7px;font-size:22px}.sub{margin:0 0 27px;color:var(--muted);font-size:13px;line-height:1.7}label{display:block;margin:15px 0 7px;color:#a6b8c6;font-size:12px;font-weight:700}input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:#061522;color:var(--text);padding:0 13px;outline:none}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,182,.09)}button{width:100%;height:47px;margin-top:23px;border:0;border-radius:10px;color:#03211b;background:linear-gradient(135deg,#54efd4,#13ab93);font-weight:900;cursor:pointer;box-shadow:0 12px 28px rgba(34,211,182,.16)}button:hover{filter:brightness(1.08)}.error{margin:0 0 17px;padding:11px 12px;border:1px solid rgba(255,150,150,.28);border-radius:9px;color:#ffd0d0;background:rgba(100,26,35,.25);font-size:12px}.foot{margin-top:20px;padding-top:17px;border-top:1px solid rgba(36,65,88,.7);font-size:11px;color:#60798c;line-height:1.7}@media(max-width:760px){.wrap{grid-template-columns:1fr}.intro{padding:31px 27px}.intro h1{font-size:28px}.intro p,.points{display:none}.eyebrow{margin-top:25px}.form-panel{padding:32px 27px}}
  </style>
</head>
<body><main class="wrap"><section class="intro"><div class="mark">讯</div><div class="eyebrow">BIAOXUN INTELLIGENCE</div><h1>甲方情报台</h1><p>从招标采购公告中识别采购单位联系方式，把分散在正文里的联系人、电话、邮箱与地址整理成可用名单。</p><div class="points"><div class="point"><i>✓</i>关键词检索与日期范围筛选</div><div class="point"><i>✓</i>甲方段落识别与代理机构排除</div><div class="point"><i>✓</i>单位合并去重并导出 CSV</div></div></section><section class="form-panel"><h2>授权登录</h2><p class="sub">本系统包含业务联系方式数据，请使用分配的账号访问。</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="{{ prefix }}/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" autofocus required placeholder="请输入用户名"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"><button type="submit">进入工作台 →</button></form><div class="foot">连续登录失败会临时限制访问。请勿将导出的联系方式公开传播或用于无关用途。</div></section></main></body></html>

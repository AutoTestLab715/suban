name: 微信小程序 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查项目结构
        run: |
          echo "检查核心文件..."
          test -f project.config.json && echo "✅ project.config.json"
          test -f app.json && echo "✅ app.json"
          test -f app.js && echo "✅ app.js"
          test -d pages && echo "✅ pages 目录"
          test -d miniprogram && echo "✅ miniprogram 目录"
          echo "检查完成"
